# _dgist traffic generator, OURS mode (.env TRAFFIC_GEN=1 + DEMO_MODE=ours, 2026-11-13): an overlay on docker-compose.yaml, added by dgist.sh
#   docker compose -f docker-compose.yaml -f docker-compose.tgen.yaml ...
# The l1 container additionally runs the RU emulator + testMAC for 5 emulator cells (L1 cells 0-4, loop aerial02 <-> aerial03); the phones'
# Benetel cell of the OAI gNB becomes L1 cell 5. Everything else (gNB, core, VA / non-VA services, xApp) is unchanged.
services:
  l1:
    volumes:
      - ${TRAFFIC_GEN_TV_DIR:-/data/dgist_tgen/testVectors}:/opt/nvidia/cuBB/testVectors:ro   # test vectors + launch pattern of the 5 cells
      - ${TRAFFIC_GEN_LOG_DIR:-/data/dgist_tgen/log}:/opt/dgist/tglog                           # full nvlog files (several GB per hour) off the root disk
    environment:
      - TG_L1_GDB=${TG_L1_GDB:-0}     # debug only: 1 = the L1 under gdb -batch (backtrace of a crash in l1_console.log)
    command: ["bash", "/opt/dgist/scripts/l1_entrypoint_tg.sh"]
    stop_grace_period: 90s      # testMAC -> L1 -> RU emulator, then the log collection
