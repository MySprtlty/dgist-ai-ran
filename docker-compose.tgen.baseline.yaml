# _dgist traffic generator, BASELINE mode (.env TRAFFIC_GEN=1 + DEMO_MODE=baseline, 2026-11-13): an overlay on docker-compose.baseline.yaml
#   docker compose -f docker-compose.baseline.yaml -f docker-compose.tgen.baseline.yaml ...
# The l1 container runs our build with every dApp feature switched off (MPS, static mps_sm_* of the MIG arm, hook disabled, no tenant) on
# the MIG 4g instance + the RU emulator + testMAC for the 5 emulator cells. The naive YOLO server (dgist-yolo, MIG 3g) and the gNB are unchanged.
services:
  l1:
    volumes:
      - ${TRAFFIC_GEN_TV_DIR:-./tgen/testVectors}:/opt/nvidia/cuBB/testVectors:ro   # test vectors + launch pattern of the 5 cells (scripts/fetch_testvectors.sh)
      - ${TRAFFIC_GEN_LOG_DIR:-./tgen/log}:/opt/dgist/tglog                           # full nvlog files (several GB per hour): put ./tgen on a big disk
    environment:
      - TRAFFIC_GEN_LOG_DIR=${TRAFFIC_GEN_LOG_DIR:-./tgen/log}     # host path of /opt/dgist/tglog for the links in runs/<name>/ (dgist.sh exports it absolute)
      - TG_L1_GDB=${TG_L1_GDB:-0}     # debug only: 1 = the L1 under gdb -batch (backtrace of a crash in l1_console.log)
    command: ["bash", "/opt/dgist/scripts/l1_entrypoint_tg.sh"]
    stop_grace_period: 90s
