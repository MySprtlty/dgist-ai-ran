# generated by hybrid_yaml.py: OAI gNB on the baseline prefix 'nvipc' (gnb.conf unchanged, cell_id 0 on the wire) -> L1 cell 5 (Benetel);
# testMAC on 'nvipc1' (5 emulator cells, wire ids 0..4) -> L1 cells 0..4. Rules: transport_id == index, sum(len(phy_cells)) ==
# cell_group_num, no duplicates (cuphyl2adapter/lib/nvPHY/nv_phy_mac_transport.cpp:416-486). pcap: baseline pcap_enable kept for the OAI transport.
---
aerial_sdk_version: 25-3-cubb
wait_all_cell_config: 1
transport:
  - transport_id: 0
    phy_cells: [0, 1, 2, 3, 4]
    type: shm
    shm_config:
      prefix: nvipc1
      cuda_device_id: 0
      ring_len: 8192
      mempool_size:
        cpu_msg:
          buf_size: 15000
          pool_len: 4096
        cpu_data:
          buf_size: 576000
          pool_len: 1024
        cpu_large:
          buf_size: 4096000
          pool_len: 64
        cuda_data:
          buf_size: 307200
          pool_len: 0
        gpu_data:
          buf_size: 576000
          pool_len: 0
    app_config:
      grpc_forward: 0
      debug_timing: 0
      pcap_enable: 0
      pcap_sync_save: 0
      pcap_shm_caching_cpu_core: 14
      pcap_file_saving_cpu_core: 14
      pcap_cache_size_bits: 29
      pcap_file_size_bits: 31
      pcap_max_data_size: 8000

      msg_filter: []
      cell_filter: []
  - transport_id: 1
    phy_cells: [5]
    type: shm
    shm_config:
      prefix: nvipc
      cuda_device_id: 0
      ring_len: 8192
      mempool_size:
        cpu_msg:
          buf_size: 15000
          pool_len: 4096
        cpu_data:
          buf_size: 576000
          pool_len: 1024
        cpu_large:
          buf_size: 4096000
          pool_len: 64
        cuda_data:
          buf_size: 307200
          pool_len: 0
        gpu_data:
          buf_size: 576000
          pool_len: 0
    app_config:
      grpc_forward: 0
      debug_timing: 0
      pcap_enable: 1
      pcap_sync_save: 0
      pcap_shm_caching_cpu_core: 14
      pcap_file_saving_cpu_core: 14
      pcap_cache_size_bits: 29
      pcap_file_size_bits: 31
      pcap_max_data_size: 8000

      msg_filter: []
      cell_filter: []
